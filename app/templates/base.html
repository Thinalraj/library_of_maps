<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Library of Maps{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('main.estate_gallery') }}">Library of Maps</a>
      <div class="ms-auto d-flex align-items-center">
        {% if current_user.is_authenticated %}
          <span class="me-3">Logged in as {{ current_user.email }}</span>
          <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary btn-sm">Logout</a>
        {% else %}
          <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-sm">Login</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    {% block content %}
    <!-- Page specific content goes here -->
    {% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
